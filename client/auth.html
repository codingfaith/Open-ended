<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="landing-container" id="form-auth-container">
        <div class="heading">
            <img src="Plus94_logo2.png" alt="company logo" class="logo">
            <div class="ubuntu-text">
                <p>Ubuntex Index</p>
                <span>Measuring Ubuntu in Society</span>
            </div>
        </div>
        <nav>
            <a href="./index">Home</a>
            <a href="./about">About</a>
            <a href="./contact">Contact</a>
        </nav>
        <div id="auth-container" class="form">
            <div id="login-form">
                <h2>Ubuntex Index Login</h2>  
                <input type="email" id="login-email" placeholder="Email" required>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Password..." required>

                    <button type="button" class="toggle-password" data-target="login-password">
                        <!-- Eye Open -->
                        <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor"
                                d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10a5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z" />
                        </svg>

                        <!-- Eye Closed -->
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
                            <path fill="currentColor"
                                d="M2.81 2.81L1.39 4.22l3.02 3.02C2.69 8.54 1.48 10.14 1 12c1.73 3.89 6 7 11 7c1.95 0 3.78-.47 5.39-1.3l3.39 3.39l1.41-1.41L2.81 2.81zM12 17c-2.76 0-5-2.24-5-5c0-.74.17-1.44.46-2.06l1.62 1.62A2.5 2.5 0 0 0 12.44 15l1.54 1.54c-.63.29-1.3.46-1.98.46zm9.19-5c-.66-1.49-1.72-2.86-3.06-3.97L16.7 9.46A4.97 4.97 0 0 1 17 12c0 .44-.06.87-.17 1.28l4.36 4.36c.79-.92 1.44-1.95 1.81-3.04c-.48-1.86-1.69-3.46-3.81-4.6z" />
                        </svg>
                    </button>
                </div>

                <button id="login-btn">
                    <span class="button-text">Login</span>
                    <span class="loading-spinner" style="display:none;">
                        <svg class="spinner" viewBox="0 0 50 50" style="width:20px;height:20px;">
                            <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                        </svg>
                    </span>
                </button>
                <p>Don't have an account? <button id="show-signup">Sign up</button></p>
            </div>
            <div id="signup-form" class="form" style="display:none;">
                <h2>Ubuntex Index Sign-up</h2>  
                <input type="text" id="signup-firstname" placeholder="First Name" required>
                <input type="text" id="signup-lastname" placeholder="Last Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <div class="password-wrapper">
                <input type="password" id="signup-password" placeholder="Password" required>

                <button type="button" class="toggle-password" data-target="signup-password">
                    <!-- Eye Open -->
                    <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor"
                            d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10a5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z" />
                    </svg>

                    <!-- Eye Closed -->
                    <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
                        <path fill="currentColor"
                            d="M2.81 2.81L1.39 4.22l3.02 3.02C2.69 8.54 1.48 10.14 1 12c1.73 3.89 6 7 11 7c1.95 0 3.78-.47 5.39-1.3l3.39 3.39l1.41-1.41L2.81 2.81zM12 17c-2.76 0-5-2.24-5-5c0-.74.17-1.44.46-2.06l1.62 1.62A2.5 2.5 0 0 0 12.44 15l1.54 1.54c-.63.29-1.3.46-1.98.46zm9.19-5c-.66-1.49-1.72-2.86-3.06-3.97L16.7 9.46A4.97 4.97 0 0 1 17 12c0 .44-.06.87-.17 1.28l4.36 4.36c.79-.92 1.44-1.95 1.81-3.04c-.48-1.86-1.69-3.46-3.81-4.6z" />
                    </svg>
                </button>
            </div>

            <button id="signup-btn">
                <span class="button-text">Sign up</span>
                <span class="loading-spinner" style="display:none;">
                    <svg class="spinner" viewBox="0 0 50 50" style="width:20px;height:20px;">
                        <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                    </svg>
                </span>
            </button>
            <p>Already have an account? <button id="show-login">Login</button></p>
            </div>
        </div>
        <div id="auth-error" class="logout-message"></div>
    </div>
    <script src="auth.js" type="module" defer></script>
</body>
</html>
